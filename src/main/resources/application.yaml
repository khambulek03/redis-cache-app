spring:
  application:
    name: RedisCache

  datasource:
    url: jdbc:postgresql://${POSTGRES_DB_HOST}:5432/${POSTGRES_DB}
    password: ${POSTGRES_DB_PASSWORD}
    username: ${POSTGRES_DB_USER:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show-sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:app_cache_container}
      username: default
      port: 6379
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8090